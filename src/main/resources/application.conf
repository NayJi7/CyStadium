cystadium {
  host = ${?APP_HOST}
  host = "0.0.0.0"
  port = ${?APP_PORT}
  port = 8080

  ask-timeout     = 5s
  payment-timeout = 10s
  session-ttl     = 15m
  reservation-ttl = 10m

  database {
    driver   = "org.postgresql.Driver"
    url      = "jdbc:postgresql://"${DB_HOST}":"${DB_PORT}"/"${DB_NAME}
    user     = ${DB_USER}
    password = ${DB_PASSWORD}

    # HikariCP — pool de connexions
    connectionPool    = "HikariCP"
    numThreads        = 5
    maxConnections    = 10
    minConnections    = 2
    connectionTimeout = 30000
    idleTimeout       = 600000
  }
}

akka {
  loglevel = "INFO"
  actor {
    provider = "local"
  }
}
